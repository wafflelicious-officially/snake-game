<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Arcade</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at center,#26365c,#080b16 70%);
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.arcade{
    width:500px;
    max-width:95%;
    background:#11182b;
    border:5px solid #394b7a;
    border-radius:20px;
    padding:20px;
    box-shadow:
        0 0 30px #426cff,
        inset 0 0 25px #000;
    text-align:center;
}

h1{
    margin:0 0 10px;
    color:#55ffcc;
    text-shadow:0 0 15px #00ffaa;
    letter-spacing:3px;
}

.stats{
    display:flex;
    justify-content:space-around;
    background:#080d19;
    border-radius:10px;
    padding:10px;
    margin-bottom:12px;
    font-weight:bold;
}

canvas{
    display:block;
    width:100%;
    max-width:420px;
    margin:auto;
    background:#050912;
    border:3px solid #40577f;
    border-radius:8px;
    image-rendering:pixelated;
}

#message{
    min-height:25px;
    margin:12px;
    color:#ffe066;
    font-weight:bold;
}

button{
    background:#3159c9;
    border:0;
    color:white;
    padding:12px 25px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #3159c9;
}

button:hover{
    background:#4b75ee;
}

.controls{
    margin-top:12px;
    color:#9eacd0;
    font-size:14px;
}

#touch{
    display:grid;
    grid-template-columns:repeat(3,55px);
    justify-content:center;
    gap:6px;
    margin-top:12px;
}

#touch button{
    padding:12px;
    width:55px;
    height:45px;
}

.empty{
    visibility:hidden;
}
</style>
</head>

<body>

<div class="arcade">

<h1>🐍 SNAKE</h1>

<div class="stats">
    <span>🏆 SCORE: <span id="score">0</span></span>
    <span>⭐ HIGH: <span id="high">0</span></span>
</div>

<canvas id="game" width="420" height="420"></canvas>

<div id="message">
    Press START to play!
</div>

<button id="start">
    START GAME
</button>

<div class="controls">
    Use <b>WASD</b> or <b>Arrow Keys</b> to move.
</div>

<div id="touch">
    <button class="empty"></button>
    <button data-dir="up">⬆️</button>
    <button class="empty"></button>

    <button data-dir="left">⬅️</button>
    <button data-dir="down">⬇️</button>
    <button data-dir="right">➡️</button>
</div>

</div>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* ==========================
   GAME SETTINGS
========================== */

const grid=21;

const tile=20;


/* ==========================
   GAME VARIABLES
========================== */

let snake;

let food;

let direction;

let nextDirection;

let score=0;

let highScore=
    Number(
        localStorage.getItem(
            "snakeHighScore"
        )
    ) || 0;

let gameRunning=false;

let gameTimer;

let speed=140;


/* ==========================
   DISPLAY
========================== */

document.getElementById(
    "high"
).textContent=highScore;


/* ==========================
   START
========================== */

document.getElementById(
    "start"
).onclick=startGame;


function startGame(){

    clearInterval(gameTimer);

    snake=[
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];

    direction={
        x:1,
        y:0
    };

    nextDirection={
        x:1,
        y:0
    };

    score=0;

    speed=140;

    gameRunning=true;

    spawnFood();

    updateScore();

    document.getElementById(
        "message"
    ).textContent=
        "Eat the food! 🍎";

    gameTimer=setInterval(
        gameLoop,
        speed
    );

    draw();
}


/* ==========================
   FOOD
========================== */

function spawnFood(){

    let valid=false;

    while(!valid){

        food={
            x:Math.floor(
                Math.random()*grid
            ),

            y:Math.floor(
                Math.random()*grid
            )
        };

        valid=
            !snake.some(
                part =>
                    part.x===food.x &&
                    part.y===food.y
            );
    }
}


/* ==========================
   GAME LOOP
========================== */

function gameLoop(){

    direction=nextDirection;

    const head={
        x:
            snake[0].x+
            direction.x,

        y:
            snake[0].y+
            direction.y
    };


    /* WALL COLLISION */

    if(
        head.x<0 ||
        head.x>=grid ||
        head.y<0 ||
        head.y>=grid
    ){

        gameOver();

        return;
    }


    /* BODY COLLISION */

    if(
        snake.some(
            part =>
                part.x===head.x &&
                part.y===head.y
        )
    ){

        gameOver();

        return;
    }


    snake.unshift(head);


    /* FOOD */

    if(
        head.x===food.x &&
        head.y===food.y
    ){

        score+=10;

        spawnFood();

        increaseSpeed();

        updateScore();

    }else{

        snake.pop();

    }


    draw();
}


/* ==========================
   SPEED
========================== */

function increaseSpeed(){

    speed=
        Math.max(
            55,
            140-
            Math.floor(score/50)*8
        );

    clearInterval(gameTimer);

    gameTimer=setInterval(
        gameLoop,
        speed
    );
}


/* ==========================
   DRAW
========================== */

function draw(){

    /* BACKGROUND */

    ctx.fillStyle="#050912";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle=
        "rgba(70,100,150,.15)";

    ctx.lineWidth=1;

    for(let i=0;i<=grid;i++){

        ctx.beginPath();

        ctx.moveTo(
            i*tile,
            0
        );

        ctx.lineTo(
            i*tile,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i*tile
        );

        ctx.lineTo(
            canvas.width,
            i*tile
        );

        ctx.stroke();
    }


    /* FOOD */

    ctx.shadowBlur=15;

    ctx.shadowColor="#ff304f";

    ctx.fillStyle="#ff304f";

    ctx.beginPath();

    ctx.arc(
        food.x*tile+10,
        food.y*tile+10,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;


    /* SNAKE */

    snake.forEach(
        (part,index)=>{

            if(index===0){

                ctx.fillStyle="#72ffce";

                ctx.shadowBlur=12;

                ctx.shadowColor="#00ffaa";

            }else{

                ctx.fillStyle=
                    index%2===0
                    ? "#20dca3"
                    : "#18b98b";

                ctx.shadowBlur=0;
            }


            ctx.fillRect(
                part.x*tile+2,
                part.y*tile+2,
                tile-4,
                tile-4
            );
        }
    );


    ctx.shadowBlur=0;


    /* EYES */

    if(snake.length>0){

        const head=snake[0];

        ctx.fillStyle="#071018";

        let eye1;
        let eye2;


        if(direction.x===1){

            eye1={
                x:head.x*tile+14,
                y:head.y*tile+6
            };

            eye2={
                x:head.x*tile+14,
                y:head.y*tile+14
            };

        }else if(direction.x===-1){

            eye1={
                x:head.x*tile+5,
                y:head.y*tile+6
            };

            eye2={
                x:head.x*tile+5,
                y:head.y*tile+14
            };

        }else if(direction.y===-1){

            eye1={
                x:head.x*tile+6,
                y:head.y*tile+5
            };

            eye2={
                x:head.x*tile+14,
                y:head.y*tile+5
            };

        }else{

            eye1={
                x:head.x*tile+6,
                y:head.y*tile+14
            };

            eye2={
                x:head.x*tile+14,
                y:head.y*tile+14
            };
        }


        ctx.fillRect(
            eye1.x,
            eye1.y,
            3,
            3
        );

        ctx.fillRect(
            eye2.x,
            eye2.y,
            3,
            3
        );
    }
}


/* ==========================
   SCORE
========================== */

function updateScore(){

    document.getElementById(
        "score"
    ).textContent=score;

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "snakeHighScore",
            highScore
        );
    }

    document.getElementById(
        "high"
    ).textContent=highScore;
}


/* ==========================
   GAME OVER
========================== */

function gameOver(){

    gameRunning=false;

    clearInterval(gameTimer);

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "snakeHighScore",
            highScore
        );
    }

    updateScore();

    document.getElementById(
        "message"
    ).textContent=
        "💥 GAME OVER! Score: "+
        score;

    drawGameOver();
}


/* ==========================
   GAME OVER SCREEN
========================== */

function drawGameOver(){

    ctx.fillStyle=
        "rgba(0,0,0,.65)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.textAlign="center";

    ctx.fillStyle="#fff";

    ctx.font=
        "bold 38px Arial";

    ctx.fillText(
        "GAME OVER",
        canvas.width/2,
        190
    );


    ctx.font=
        "bold 22px Arial";

    ctx.fillStyle="#55ffcc";

    ctx.fillText(
        "SCORE: "+score,
        canvas.width/2,
        230
    );


    ctx.font=
        "16px Arial";

    ctx.fillStyle="#ddd";

    ctx.fillText(
        "Press START to play again",
        canvas.width/2,
        270
    );
}


/* ==========================
   KEYBOARD
========================== */

document.addEventListener(
    "keydown",
    function(e){

        const key=
            e.key.toLowerCase();


        if(
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                "w",
                "a",
                "s",
                "d"
            ].includes(key)
        ){

            e.preventDefault();
        }


        if(
            key==="arrowup" ||
            key==="w"
        ){

            changeDirection(
                0,-1
            );

        }else if(
            key==="arrowdown" ||
            key==="s"
        ){

            changeDirection(
                0,1
            );

        }else if(
            key==="arrowleft" ||
            key==="a"
        ){

            changeDirection(
                -1,0
            );

        }else if(
            key==="arrowright" ||
            key==="d"
        ){

            changeDirection(
                1,0
            );
        }
    }
);


/* ==========================
   DIRECTION
========================== */

function changeDirection(x,y){

    if(!gameRunning)
        return;


    if(
        direction.x===-x &&
        direction.y===-y
    ){

        return;
    }


    nextDirection={
        x:x,
        y:y
    };
}


/* ==========================
   TOUCH BUTTONS
========================== */

document.querySelectorAll(
    "#touch button[data-dir]"
).forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            const d=
                button.dataset.dir;

            if(d==="up")
                changeDirection(0,-1);

            if(d==="down")
                changeDirection(0,1);

            if(d==="left")
                changeDirection(-1,0);

            if(d==="right")
                changeDirection(1,0);
        }
    );

});


/* ==========================
   INITIAL SCREEN
========================== */

snake=[
    {x:10,y:10},
    {x:9,y:10},
    {x:8,y:10}
];

food={
    x:15,
    y:10
};

direction={
    x:1,
    y:0
};

draw();

</script>

</body>
</html>
